version: '3.8'

services:
  laravel_backend:
    build:
      context: .
      target: dev 
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html 
    environment:
      - DB_CONNECTION=mysql
      - DB_PORT=3306
      - DB_DATABASE=hikala
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"  # پورت میزبان:پورت کانتینر
    environment:
      - MYSQL_DATABASE=hikala
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - db_data:/var/lib/mysql

  # 👇 این سرویس رو اضافه کنید
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db  # اسم سرویس دیتابیس
      - PMA_PORT=3306  # پورت داخلی دیتابیس
      - PMA_ARBITRARY=1
    depends_on:
      - db

volumes:
  db_data: