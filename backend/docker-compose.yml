version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hikala_db_container
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hikala
      MYSQL_ROOT_PASSWORD: root

  laravel_backend:
    build:
      context: .
      target: dev 
    container_name: laravel_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hikala
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hikala_phpmyadmin
    ports:
      - "8181:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db